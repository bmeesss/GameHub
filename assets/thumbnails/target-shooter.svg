  <circle cx="180" cy="266" r="9" fill="#2a1620"/>
  <path d="M330 120 V60 M330 240 V300 M270 180 H210 M390 180 H450" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity=".85"/>
