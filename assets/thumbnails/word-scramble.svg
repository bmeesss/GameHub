<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <title>Word Scramble artwork</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1530"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="110" cy="80" r="130" fill="#a78bfa" opacity=".14"/>
  <circle cx="540" cy="300" r="120" fill="#22d3ee" opacity=".10"/>
  <g font-family="Arial, sans-serif" font-weight="800" font-size="44" text-anchor="middle">
    <rect x="90" y="130" width="80" height="80" rx="14" fill="#2a3560" stroke="#7c5cff" stroke-width="3"/>
    <text x="130" y="186" fill="#f2f5ff">R</text>
    <rect x="185" y="130" width="80" height="80" rx="14" fill="#2a3560" stroke="#7c5cff" stroke-width="3"/>
    <text x="225" y="186" fill="#f2f5ff">O</text>
    <rect x="280" y="130" width="80" height="80" rx="14" fill="#7c5cff"/>
    <text x="320" y="186" fill="#fff">C</text>
    <rect x="375" y="130" width="80" height="80" rx="14" fill="#2a3560" stroke="#7c5cff" stroke-width="3"/>
    <text x="415" y="186" fill="#f2f5ff">K</text>
    <rect x="470" y="130" width="80" height="80" rx="14" fill="#2a3560" stroke="#7c5cff" stroke-width="3"/>
    <text x="510" y="186" fill="#f2f5ff">E</text>
  </g>
  <path d="M200 260 L440 260" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 14"/>
  <circle cx="200" cy="260" r="10" fill="#22d3ee"/>
  <circle cx="440" cy="260" r="10" fill="#22d3ee"/>
</svg>
