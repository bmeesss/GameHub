<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival Arena — Play — GameHub</title>
  <meta name="description" content="Play Survival Arena on GameHub: kite and blast endless waves of drones in a top-down arena.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Survival Arena</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="wave">1</span></div>
        <div class="hud-item"><span class="hud-label">Health</span><span class="hud-value" id="health">5</span></div>
        <div class="hud-item"><span class="hud-label">Best wave</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="660" height="460" aria-label="Survival arena"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Survival Arena</h2>
          <p id="overlayText">Move with WASD or the arrow keys, aim with the mouse and hold to fire. Every wave brings more drones — grab the green repair cores to stay alive.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Enter arena</button>
        </div>
      </div>
      <p class="hint">WASD / arrows to move · mouse aims · hold click or Space to fire · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="survival-arena"></script>
  <script src="game.js"></script>
</body>
</html>
