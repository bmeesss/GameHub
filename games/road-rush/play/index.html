<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Rush — Play — GameHub</title>
  <meta name="description" content="Play Road Rush on GameHub: Chase the sunset highway and dodge the traffic.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Road Rush</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">km/h</span><span class="hud-value" id="speed">0</span></div>
        <div class="hud-item"><span class="hud-label">Distance</span><span class="hud-value" id="dist">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="480" height="640" aria-label="Road Rush game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Road Rush</h2>
          <p id="overlayText">Chase the sunset highway and dodge the traffic.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Arrows or WASD to steer and speed up · crashing ends the run · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="road-rush"></script>
  <script src="game.js"></script>
</body>
</html>
