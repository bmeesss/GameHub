<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Landing — Play — GameHub</title>
  <meta name="description" content="Play Rocket Landing on GameHub: burn fuel carefully and touch down gently on the pad.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Rocket Landing</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Fuel</span><span class="hud-value" id="fuel">100</span></div>
        <div class="hud-item"><span class="hud-label">Pad</span><span class="hud-value" id="pad">1</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="640" height="440" aria-label="Landing site"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Rocket Landing</h2>
          <p id="overlayText">Rotate with the arrow keys, thrust with the up arrow. Land upright and slow on the glowing pad — hard impacts and tilted landings cost you.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Launch</button>
        </div>
      </div>
      <p class="hint">↑ thrust · ←/→ rotate · Space for a quick thrust · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="rocket-landing"></script>
  <script src="game.js"></script>
</body>
</html>
