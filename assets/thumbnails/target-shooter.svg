      <stop offset="0" stop-color="#2a1620"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
