<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Dodge — Play — GameHub</title>
  <meta name="description" content="Play Brick Dodge on GameHub: dodge the falling brick storm and survive as long as you can.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Brick Dodge</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="400" height="500" aria-label="Brick Dodge game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Brick Dodge</h2>
          <p id="overlayText">Slide your ship and dodge the falling bricks. How long can you survive?</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">← → or A/D to slide · P to pause · drag on touch screens</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="brick-dodge"></script>
  <script src="game.js"></script>
</body>
</html>
