<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Drift — Play — GameHub</title>
  <meta name="description" content="Play Turbo Drift on GameHub: slide through neon circuits in this pseudo-3D arcade racer.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Turbo Drift</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Lap</span><span class="hud-value" id="lap">1/3</span></div>
        <div class="hud-item"><span class="hud-label">Speed</span><span class="hud-value" id="speed">0</span></div>
        <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="time">0:00</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="480" height="600" aria-label="Turbo Drift race track"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Turbo Drift</h2>
          <p id="overlayText">Complete 3 laps. Dodge traffic, stay on the road — the grass slows you down!</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start race</button>
        </div>
      </div>
      <div class="touch-controls" id="touchControls">
        <button type="button" data-act="left" aria-label="Steer left">◀</button>
        <button type="button" data-act="right" aria-label="Steer right">▶</button>
      </div>
      <p class="hint">Arrows / A,D to steer · auto-accelerates · P to pause</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="turbo-drift"></script>
  <script src="game.js"></script>
</body>
</html>
