<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Puzzle — Play — GameHub</title>
  <meta name="description" content="Play Slide Puzzle on GameHub: Slide the tiles until the numbers read in order.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Slide Puzzle</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Moves</span><span class="hud-value" id="moves">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="time">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="440" height="440" aria-label="Slide Puzzle game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Slide Puzzle</h2>
          <p id="overlayText">Slide the tiles until the numbers read in order.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Arrows slide tiles into the gap · clicking a neighbor works too · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="slide-puzzle"></script>
  <script src="game.js"></script>
</body>
</html>
