<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Runner — Play — GameHub</title>
  <meta name="description" content="Play Neon Runner on GameHub: sprint, jump and double-jump through an endless neon void.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Neon Runner</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <div class="hud-item"><span class="hud-label">Coins</span><span class="hud-value" id="coins">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="640" height="360" aria-label="Neon Runner game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Neon Runner</h2>
          <p id="overlayText">Jump with Space, tap or click. Press again mid-air to double-jump over tall blocks.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start running</button>
        </div>
      </div>
      <p class="hint">Space / Up / tap to jump · double-jump in mid-air · P to pause</p>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
