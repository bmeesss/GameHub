  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="110" cy="290" r="130" fill="#7c5cff" opacity=".14"/>
  <circle cx="540" cy="70" r="120" fill="#22d3ee" opacity=".12"/>
  <g transform="translate(185,30)">
