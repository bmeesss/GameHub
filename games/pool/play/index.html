<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool — Play — GameHub</title>
  <meta name="description" content="Play Pool on GameHub: aim, charge and pot your group before sinking the eight ball.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Pool</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Turn</span><span class="hud-value" id="turn">Player 1</span></div>
        <div class="hud-item"><span class="hud-label">Potted</span><span class="hud-value" id="potted">0</span></div>
        <div class="hud-item"><span class="hud-label">Your shots</span><span class="hud-value" id="shots">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="modeBtn" type="button">Mode: 2 players</button>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="760" height="440" aria-label="Pool table"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Pool</h2>
          <p id="overlayText">Eight-ball rules, simplified: pot every ball of your group, then the eight ball. Aim with the mouse or arrow keys, hold to charge and release to shoot.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Break</button>
        </div>
      </div>
      <p class="hint">Mouse aims · hold click to charge · Space shoots · arrows fine-tune · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="pool"></script>
  <script src="game.js"></script>
</body>
</html>
