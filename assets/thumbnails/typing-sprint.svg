<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <title>Typing Sprint artwork — original keyboard sprint</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a24"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a63"/>
      <stop offset="1" stop-color="#1b2440"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="530" cy="80" r="120" fill="#34d399" opacity=".13"/>
  <text x="320" y="96" text-anchor="middle" font-family="monospace" font-size="46" font-weight="bold" fill="#34d399">sprint</text>
  <text x="320" y="96" text-anchor="middle" font-family="monospace" font-size="46" font-weight="bold" fill="#22d3ee" opacity=".55">spr</text>
  <rect x="150" y="120" width="340" height="10" rx="5" fill="#1f2b47"/>
  <rect x="150" y="120" width="210" height="10" rx="5" fill="#34d399"/>
  <g fill="url(#key)" stroke="#3b4668" stroke-width="2">
    <rect x="60" y="170" width="72" height="60" rx="12"/>
    <rect x="144" y="170" width="72" height="60" rx="12"/>
    <rect x="228" y="170" width="72" height="60" rx="12"/>
    <rect x="312" y="170" width="72" height="60" rx="12"/>
    <rect x="396" y="170" width="72" height="60" rx="12"/>
    <rect x="480" y="170" width="72" height="60" rx="12"/>
    <rect x="102" y="244" width="72" height="60" rx="12"/>
    <rect x="186" y="244" width="72" height="60" rx="12"/>
    <rect x="270" y="244" width="72" height="60" rx="12"/>
    <rect x="354" y="244" width="72" height="60" rx="12"/>
    <rect x="438" y="244" width="72" height="60" rx="12"/>
  </g>
  <rect x="228" y="170" width="72" height="60" rx="12" fill="#34d399" opacity=".55"/>
  <g fill="#f2f5ff" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">
    <text x="96" y="208">T</text>
    <text x="180" y="208">Y</text>
    <text x="264" y="208">P</text>
    <text x="348" y="208">E</text>
    <text x="432" y="208">R</text>
    <text x="516" y="208">S</text>
  </g>
</svg>
