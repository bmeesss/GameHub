<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast and Catch — Play — GameHub</title>
  <meta name="description" content="Play Cast and Catch on GameHub: catch falling fish and dodge the old boots.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Cast and Catch</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Fish</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value" id="lives">3</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="400" height="500" aria-label="Cast and Catch game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Cast and Catch</h2>
          <p id="overlayText">Slide the net and catch dinner. Boots cost you a life — you have 3.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">← → / mouse to slide the net · catch fish, dodge boots · P to pause</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="cast-and-catch"></script>
  <script src="game.js"></script>
</body>
</html>
