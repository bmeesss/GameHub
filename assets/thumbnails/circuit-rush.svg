      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="trailA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="trailB" x1="1" y1="0" x2="0" y2="0">
