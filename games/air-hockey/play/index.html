<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Hockey — Play — GameHub</title>
  <meta name="description" content="Play Air Hockey on GameHub: Fast table duel against the AI or a friend.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Air Hockey</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Top</span><span class="hud-value" id="score-a">0</span></div>
        <div class="hud-item"><span class="hud-label">You</span><span class="hud-value" id="score-b">0</span></div>
        <div class="hud-item"><span class="hud-label">Streak</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="modeBtn" type="button">Mode: vs AI</button>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="520" height="700" aria-label="Air Hockey game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Air Hockey</h2>
          <p id="overlayText">Fast table duel against the AI or a friend.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Mouse or arrows move your paddle · first to 7 wins · 2P: A/D for the top paddle</p>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
