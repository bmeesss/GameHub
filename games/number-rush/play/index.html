<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Rush — Play — GameHub</title>
  <meta name="description" content="Play Number Rush on GameHub: tap tiles 1 to 25 in order against the clock.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Number Rush</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Next</span><span class="hud-value" id="next">1</span></div>
        <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="time">0.0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">–</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <div class="num-grid" id="numGrid" role="group" aria-label="Number tiles"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Number Rush</h2>
          <p id="overlayText">Tap every tile from 1 to 25 in order. Mistakes cost you 2 seconds each.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Tap 1–25 in order · or type the numbers · P to pause</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="number-rush"></script>
  <script src="game.js"></script>
</body>
</html>
