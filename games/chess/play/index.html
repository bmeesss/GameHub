<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess — Play — GameHub</title>
  <meta name="description" content="Play Chess on GameHub: full rules against a local AI or a friend on one device.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Chess</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Turn</span><span class="hud-value" id="turn">White</span></div>
        <div class="hud-item"><span class="hud-label">Status</span><span class="hud-value" id="status">Ready</span></div>
        <div class="hud-item"><span class="hud-label">Wins</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="modeBtn" type="button">Mode: vs AI</button>
        <button class="hud-btn" id="levelBtn" type="button">AI: Medium</button>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="560" height="560" aria-label="Chess board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Chess</h2>
          <p id="overlayText">Complete chess rules: legal moves, castling, en passant and promotion. Face the local AI or a friend on one device.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Click a piece, then a highlighted square · M toggles mode · L changes AI level · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="chess"></script>
  <script src="game.js"></script>
</body>
</html>
