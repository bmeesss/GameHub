<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Grid — Play — GameHub</title>
  <meta name="description" content="Play Glow Grid on GameHub: Switch every glowing pad off to clear the level.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Glow Grid</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="level">0</span></div>
        <div class="hud-item"><span class="hud-label">Moves</span><span class="hud-value" id="moves">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="restartBtn" type="button">Reshuffle</button>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <div id="grid" aria-label="Glow Grid pads"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Glow Grid</h2>
          <p id="overlayText">Switch every glowing pad off to clear the level.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Clicking a pad flips it and its neighbors · every board is solvable</p>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
