<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Escape — Play — GameHub</title>
  <meta name="description" content="Play Dungeon Escape on GameHub: grab the key and escape 3 guard-patrolled dungeons.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Dungeon Escape</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="level">1/3</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="400" height="400" aria-label="Dungeon Escape game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Dungeon Escape</h2>
          <p id="overlayText">Grab the key, then reach the stairs. Touching a guard sends you back.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Arrows / WASD to move · grab key, reach exit · avoid guards</p>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
