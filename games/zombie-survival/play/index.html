<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Survival — Play — GameHub</title>
  <meta name="description" content="Play Zombie Survival on GameHub: survive endless zombie waves with auto-fire and footwork.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Zombie Survival</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Kills</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="wave">1</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="400" height="400" aria-label="Zombie Survival game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Zombie Survival</h2>
          <p id="overlayText">Kite the horde around the arena. Your blaster fires on its own — you just survive.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">WASD / arrows to move · blaster auto-fires · P to pause</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="zombie-survival"></script>
  <script src="game.js"></script>
</body>
</html>
