<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Tower — Play — GameHub</title>
  <meta name="description" content="Play Stack Tower on GameHub: Drop sliding blocks and build the tallest tower you can.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Stack Tower</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Height</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <div class="hud-item"><span class="hud-label">Combo</span><span class="hud-value" id="combo">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="400" height="620" aria-label="Stack Tower game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Stack Tower</h2>
          <p id="overlayText">Drop sliding blocks and build the tallest tower you can.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Click, tap or press Space to drop · P pauses · perfect drops restore width</p>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
