    <path d="M560 0 V360"/>
  </g>
  <circle cx="330" cy="180" r="160" fill="url(#glow)"/>
  <circle cx="330" cy="180" r="120" fill="none" stroke="#e2e8f0" stroke-width="3" opacity=".35"/>
  <circle cx="330" cy="180" r="82" fill="none" stroke="#fb7185" stroke-width="4" opacity=".5"/>
  <circle cx="330" cy="180" r="46" fill="#fb7185" opacity=".85"/>
  <circle cx="330" cy="180" r="46" fill="none" stroke="#fecdd3" stroke-width="3"/>
  <circle cx="470" cy="96" r="26" fill="#f59e0b"/>
