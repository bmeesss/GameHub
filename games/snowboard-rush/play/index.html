<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowboard Rush — Play — GameHub</title>
  <meta name="description" content="Play Snowboard Rush on GameHub: carve between gates, dodge the trees and keep the run alive.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Snowboard Rush</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Distance</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Speed</span><span class="hud-value" id="speed">1.0x</span></div>
        <div class="hud-item"><span class="hud-label">Gates</span><span class="hud-value" id="gates">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="520" height="560" aria-label="Downhill slope"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Snowboard Rush</h2>
          <p id="overlayText">Steer down the slope, thread every gate for a speed boost and stay clear of the pines. Hitting a tree ends the run.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Drop in</button>
        </div>
      </div>
      <p class="hint">← → or A/D to carve · swipe or drag on touch · P pauses</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="snowboard-rush"></script>
  <script src="game.js"></script>
</body>
</html>
