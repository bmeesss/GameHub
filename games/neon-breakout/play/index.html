<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Breakout — Play — GameHub</title>
  <meta name="description" content="Play Neon Breakout on GameHub: smash glowing brick waves with a light-charged paddle.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Neon Breakout</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value" id="lives">3</span></div>
        <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="level">1</span></div>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <canvas id="game" width="480" height="600" aria-label="Neon Breakout game board"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Neon Breakout</h2>
          <p id="overlayText">Clear every brick. Catch falling capsules for wide paddle and multiball.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Mouse / touch / arrows to move · Space to launch · P to pause</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="neon-breakout"></script>
  <script src="game.js"></script>
</body>
</html>
