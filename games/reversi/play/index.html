<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reversi — Play — GameHub</title>
  <meta name="description" content="Play Reversi on GameHub: Trap your opponent's discs between yours to flip them.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="play-shell" id="shell">
    <header class="play-bar">
      <a class="play-back" href="../index.html">← Game page</a>
      <span class="play-title">Reversi</span>
      <button class="play-fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </header>
    <main class="game-wrap">
      <div class="hud">
        <div class="hud-item"><span class="hud-label">Dark</span><span class="hud-value" id="dark">0</span></div>
        <div class="hud-item"><span class="hud-label">Light</span><span class="hud-value" id="light">0</span></div>
        <div class="hud-item"><span class="hud-label">Turn</span><span class="hud-value" id="turn">0</span></div>
        <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
        <button class="hud-btn" id="modeBtn" type="button">Mode: vs AI</button>
        <button class="hud-btn" id="pauseBtn" type="button">Pause</button>
      </div>
      <div class="stage">
        <div id="board" aria-label="Reversi board"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Reversi</h2>
          <p id="overlayText">Trap your opponent's discs between yours to flip them.</p>
          <button class="primary-btn" id="primaryBtn" type="button">Start game</button>
        </div>
      </div>
      <p class="hint">Click a highlighted square · corners are gold · flip to 2-player for a local duel</p>
    </main>
  </div>
  <script src="../../../session.js" data-game="reversi"></script>
  <script src="game.js"></script>
</body>
</html>
